[project]
name = "screenshot-maker"
version = "0.1.0"
description = "A simple screenshot maker for the Git Novice Carpentries lesson using Visual Studio Code"
authors = [
    { name = "Sam Cuniffe", email = "s.cunliffe@ucl.ac.uk" },
    { name = "Henry Crosswell", email = "henry.crosswell.21@ucl.ac.uk" },
    { name = "David Pérez Suárez", email = "d.perez-suarez@ucl.ac.uk" },
]
requires-python = ">=3.14"
readme = "README.md"
dependencies = ["playwright", "loguru", "pillow"]

[project.scripts]
screenshot-maker = "screenshot_maker:cli"

[dependency-groups]
dev = ["prek>=0.5.6", "pytest", "pytest-cov>=7.1.0", "pytest-playwright"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.14"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[tool.ruff]
line-length = 99

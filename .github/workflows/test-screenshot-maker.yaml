name: "Test screenshot-maker code"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  update-screenshot-maker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          activate-environment: true

      - name: Check the sreenshot-maker code style
        working-directory: ./tools/screenshot-maker
        run: uv run ruff check

      - name: Install Visual Studio Code
        run: sudo snap install --classic code

      - name: Run some debug commands - check the VSCode installation
        run: |
          which code
          type -a code
          readlink -f "$(command -v code)"
          snap list | grep -E '^code\b|vscode'
          env | grep -i ozone

      - name: Run the screenshot-maker tests
        working-directory: ./tools/screenshot-maker
        run: uv run pytest

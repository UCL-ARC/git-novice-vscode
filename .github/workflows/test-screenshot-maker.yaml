name: "Test screenshot-maker code"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  screenshot-maker-code-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          activate-environment: true

      - name: Check the screenshot-maker code style
        working-directory: ./tools/screenshot-maker
        run: uv run prek --all-files

      - name: Install Visual Studio Code
        run: sudo snap install --classic code

      - name: Get the path to the VSCode binary
        run: |
          SNAP_CODE_ROOT="$(readlink -f /snap/code/current)"
          CODE_BIN="$(find "$SNAP_CODE_ROOT" -type f -name code | head -n 1)"
          "$CODE_BIN" --version
          echo "CODE_BIN=$CODE_BIN" >> $GITHUB_ENV

      - name: Run the screenshot-maker tests
        working-directory: ./tools/screenshot-maker
        run: uv run pytest

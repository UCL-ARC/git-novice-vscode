name: "Test screenshot-maker code"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  screenshot-maker-code-checks:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          activate-environment: true

      - name: Check the screenshot-maker code style
        working-directory: ./tools/screenshot-maker
        run: uv run prek --all-files

      - name: Install Visual Studio Code
        run: brew install --cask visual-studio-code

      - name: Get the path to the VSCode binary
        run: |
          CODE_BIN="/opt/homebrew/bin/code" # brittle hack from reading outpuut of the brew install command
          "$CODE_BIN" --version
          echo "CODE_BIN=$CODE_BIN" >> $GITHUB_ENV

      - name: Install the screenshot maker code
        working-directory: ./tools/screenshot-maker
        run: |
          uv sync
          uv run playwright install

      - name: Run the screenshot-maker tests
        working-directory: ./tools/screenshot-maker
        run: uv run pytest --cov

name: "Update Visual Studio Code screenshots"
on:
  schedule:
    - cron: "0 0 15 * *" # run every month on the 15th at midnight
  pull_request: # only when the screenshot maker code changes
    paths:
      - "tools/screenshot-maker/**"
  workflow_dispatch:

jobs:
  update-screenshots:
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          activate-environment: true

      - name: Install Visual Studio Code
        run: brew install --cask visual-studio-code

      - name: Get the path to the VSCode binary
        run: |
          CODE_BIN="/opt/homebrew/bin/code" # brittle hack from reading outpuut of the brew install command
          "$CODE_BIN" --version
          echo "CODE_BIN=$CODE_BIN" >> $GITHUB_ENV

      - name: Install the screenshot maker code
        working-directory: ./tools/screenshot-maker
        run: |
          uv sync
          uv run playwright install

      - name: Run the screenshot maker
        working-directory: ./tools/screenshot-maker
        run: uv run screenshot-maker

      - name: Upload the screenshots so they can be checked
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: episodes/fig/*.png

      - name: Open a PR if any screenshots changed
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: episodes/fig/*.png
          branch: update-screenshots
          delete-branch: true
          commit-message: Update VS Code screenshots
          title: Update VS Code screenshots
          body: Screenshots that changed in the scheduled run of the screenshot maker.
